name: Publish Black Pearl 0.8.1
on:
  push:
    branches: ['release/dispatch-0.8.1']
    paths: ['.github/workflows/publish-0-8-1-once.yml']

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Mancio24x/Black-Pearl
      NOTES: |
        ## Novità della 0.8.1
        - Corrette la gestione dei collegamenti tra note e la navigazione ai titoli interni.
        - Nella Rete i collegamenti reciproci hanno una sola linea. Zoom e posizione si conservano quando si apre la tastiera.
        - L’indice dei collegamenti riprende ad aggiornarsi dopo un errore.

        Aggiornamento diretto dalle versioni precedenti (stessa firma).
    steps:
      - name: Start the official release on the tested main commit
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = bef2f7d488b101c2ae4f5097187f790e5a8374a9
          if gh release view v0.8.1 --repo "$GH_REPO" >/dev/null 2>&1; then exit 0; fi
          gh workflow run release.yml --repo "$GH_REPO" --ref main -f version=0.8.1 -f notes="$NOTES"
