name: UI preview

# Screenshots of the main screens (light + dark) on an emulator. Run manually or on PRs touching UI files.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/main/res/**'
      - 'app/src/main/java/org/qosp/notes/ui/**'
      - 'scripts/capture-ui.sh'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build test APK (skips welcome screen)
        run: ./gradlew assembleDebug -PTESTLAB_BUILD=true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: scripts/capture-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-shots/
