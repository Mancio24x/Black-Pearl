name: Release

# Runs when a version tag like v0.1.0 is pushed. Creates a DRAFT GitHub release:
# the owner reviews it and presses "Publish".
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret KEYSTORE_BASE64 (see docs/TESTING.md > Release signing)"; exit 1
          fi

      - name: Check tag format
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]] || { echo "::error::Tag must be vX.Y.Z (Y, Z < 100)"; exit 1; }

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          ./gradlew assembleRelease \
            -PreleaseVersion="${GITHUB_REF_NAME#v}" \
            -Pkeystore=release.jks \
            -Pstorepass="$STORE_PASS" \
            -Pkeyalias="$KEY_ALIAS" \
            -Pkeypass="$KEY_PASS"
          rm -f app/release.jks

      - name: Verify signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare files and changelog
        run: |
          V="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "black-pearl-$V.apk"
          gzip -c app/build/outputs/mapping/release/mapping.txt > "mapping-$V.txt.gz"
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## Changes"
            if [ -n "$PREV" ]; then git log --no-merges --pretty='- %s' "$PREV..$GITHUB_REF_NAME"
            else echo "- First Black Pearl release (based on Quillpad, see docs/DECISIONS.md)"; fi
          } > CHANGELOG_RELEASE.md
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: CHANGELOG_RELEASE.md
          files: |
            black-pearl-${{ env.V }}.apk
            mapping-${{ env.V }}.txt.gz
