name: Publish Black Pearl 0.8.17
on:
  push:
    branches: ['ccr-f9d20400-msjiz3']
    paths: ['.github/workflows/publish-0-8-17-once.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Mancio24x/Black-Pearl
      NOTES: |
        ## Black Pearl 0.8.17 — Visualizzatore HTML

        - **Nuova voce «HTML»** nel menu laterale, accanto a Rete: importa file .html, .htm o .zip.
        - **Libreria**: cerca, ordina, rinomina, azzera i progressi o elimina i documenti.
        - **Visualizzatore interattivo** (sola lettura, con JavaScript): quiz ed esercizi funzionano dentro l'app.
        - **Progressi salvati da soli**: risposte, campi compilati e punto di lettura restano anche chiudendo l'app. Ogni documento è separato dagli altri.

        Aggiornamento diretto dalle versioni precedenti (stessa firma).
    steps:
      - name: Publish the signed draft built from the tag
        run: |
          set -euo pipefail
          printf '%s' "$NOTES" > notes.md
          test "$(gh api "repos/$GH_REPO/commits/v0.8.17" --jq .sha)" = ff5cfa20936700e541a9fafc40e7ef8a1df157ba
          gh release view v0.8.17 --json assets --jq '.assets[].name' | grep -qx 'black-pearl-0.8.17.apk'
          gh release edit v0.8.17 --title "Black Pearl 0.8.17" --notes-file notes.md --draft=false --latest
          gh release view v0.8.17 --json isDraft,name --jq '"\(.name) draft=\(.isDraft)"'
